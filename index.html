<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daybreak Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="images/daybreaklogo.png" alt="Daybreak Cafe logo" class="logo">
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
            <a href="#events">Events</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
    <section id="home" class="hero">
        <h1>Fresh Coffee · Calm Mornings</h1>
        <p>Your neighborhood cafe for espresso, pastries, and light meals.</p>
        <a href="#menu" class="button">View Menu</a>

        <div class="info-box">
            <h2>Today's Special</h2>
            <p>Iced Spanish Latte + Butter Croissant: ₱180</p>
        </div>

        <div class="info-box">
            <h2>Opening Hours</h2>
            <p>Mon–Fri: 7:00 AM – 9:00 PM</p>
            <p>Sat–Sun: 8:00 AM – 10:00 PM</p>
        </div>
    </section>
</main>
</body>
</html>
